# A load generator: hammers the php-apache Service in a tight loop to drive
# CPU up so the HPA scales out. Delete this pod to let it scale back down.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  containers:
    - name: load
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -q -O- http://php-apache; done"]
