# Consume config as ENVIRONMENT VARIABLES.
#  - APP_COLOR comes from the ConfigMap
#  - API_KEY comes from the Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-env
  template:
    metadata:
      labels:
        app: app-env
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: APP_COLOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_COLOR
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_KEY
