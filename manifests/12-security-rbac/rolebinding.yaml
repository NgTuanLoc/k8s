# A RoleBinding ties a Role to a subject (here, the 'reader' ServiceAccount).
# After this, 'reader' can read pods in rbac-lab — and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-can-read-pods
  namespace: rbac-lab
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: rbac-lab
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
