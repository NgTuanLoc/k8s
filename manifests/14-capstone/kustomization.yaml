# Bundles the whole app so `kubectl apply -k .` deploys it in one command,
# and `kubectl delete -k .` tears it all down. Sets the namespace for everything.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: capstone
resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - db-statefulset.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - hpa.yaml
