# A Job runs a pod to COMPLETION (not forever). Good for batch/one-off work.
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
spec:
  completions: 1            # run to success once
  backoffLimit: 2           # retry up to 2 times on failure, then mark Failed
  ttlSecondsAfterFinished: 300   # auto-delete 5 min after finishing
  template:
    spec:
      restartPolicy: Never  # Jobs use Never or OnFailure (not Always)
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo processing batch...; sleep 3; echo done"]
