# One Service in front of both colors. It selects version=blue to start.
# Blue-green switch = patch this selector to version=green (instant flip).
apiVersion: v1
kind: Service
metadata:
  name: bluegreen
spec:
  selector:
    app: bluegreen
    version: blue        # <-- the live version; patch to "green" to switch
  ports:
    - port: 80
      targetPort: 5678
