# Same routing as ingress.yaml, plus HTTPS. The cert/key live in a
# kubernetes.io/tls Secret named shop-tls (created in the lab with openssl).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["shop.local"]
      secretName: shop-tls
  rules:
    - host: shop.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
