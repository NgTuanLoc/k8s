# Two containers in ONE Pod, sharing an emptyDir volume.
# - "writer" (busybox) writes a file into /shared every 5s.
# - "nginx" serves the same /shared directory.
# Both see the same files because the volume is mounted into both.
apiVersion: v1
kind: Pod
metadata:
  name: multi
  labels:
    app: multi
spec:
  volumes:
    - name: shared            # one volume, shared by both containers
      emptyDir: {}            # ephemeral: lives & dies with the Pod
  containers:
    - name: nginx             # main container: serves the shared dir
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
    - name: writer            # sidecar: writes into the shared dir
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "hello from the sidecar" > /shared/hello;
          while true; do date >> /shared/index.html; sleep 5; done
      volumeMounts:
        - name: shared
          mountPath: /shared
