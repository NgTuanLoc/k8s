# Lab namespace + one backend (`api`) we'll lock down. Clients are throwaway
# curl pods started with different labels.
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: netpol-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo
          args: ["-text=api says hi", "-listen=:5678"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: netpol-lab
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 5678
