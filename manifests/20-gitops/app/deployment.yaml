# The app Argo CD keeps in sync with git. In the lab you change -text and
# replicas HERE, commit, push — and the cluster follows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo
          args: ["-text=hello from git v1", "-listen=:5678"]
          ports:
            - containerPort: 5678
